<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>Tabby Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/ui/icon_coin.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
  :root {
    /* Layout: full-bleed 3D run; HUD hugs the top corners; menus are chunky cartoon stickers over the live scene */
    --ink: #3b1d0e;
    --sun: #ffd23f;
    --tangerine: #ff8a1f;
    --cream: #fff5df;
    --teal: #1ea896;
    --haze: #f3d9b1;
    --white: #ffffff;
    --font-display: 'Lilita One', 'Noto Sans TC', 'Arial Black', sans-serif;
    --font-cjk: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --ol: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
          2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 5px 0 var(--ink);
    --ol-sm: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 3px 0 var(--ink);
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--haze); color: var(--ink);
    font-family: var(--font-cjk); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #touch { position: absolute; inset: 0; touch-action: none; }
  button { font: inherit; color: inherit; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 16px; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .score-box { display: grid; gap: 4px; justify-items: start; }
  .score-label { font: 15px/1 var(--font-display); letter-spacing: 0.14em; color: var(--cream); text-shadow: var(--ol-sm); }
  #score { font: clamp(36px, 6vw, 54px)/1 var(--font-display); color: var(--white); text-shadow: var(--ol);
    font-variant-numeric: tabular-nums; }
  #mult { margin-top: 4px; padding: 5px 13px 3px; font: 22px/1 var(--font-display); color: var(--white);
    background: var(--teal); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
    text-shadow: var(--ol-sm); }
  #mult.hot { background: linear-gradient(#ffd84d, #ff9a1f); }
  #mult.bump { animation: bump 0.35s ease-out; }
  .hud-right { display: grid; justify-items: end; gap: 10px; }
  .coin-row { display: flex; align-items: center; gap: 10px; }
  #coin-box { display: flex; align-items: center; gap: 6px; padding: 3px 18px 3px 4px; background: rgba(59, 29, 14, 0.58);
    border: 3px solid var(--ink); border-radius: 999px; }
  #coin-box img { width: 42px; height: 42px; }
  #coin-box.pop img { animation: flip 0.28s ease-out; }
  #coins { font: 30px/1 var(--font-display); color: var(--sun); text-shadow: var(--ol-sm); font-variant-numeric: tabular-nums;
    min-width: 2ch; }
  .icon-btn { pointer-events: auto; width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--ink);
    background: var(--cream); box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 4px solid var(--white); outline-offset: 4px; }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn .off { display: none; }
  .icon-btn.muted .on { display: none; }
  .icon-btn.muted .off { display: block; }
  #powerbars { display: grid; gap: 8px; justify-items: end; }
  .pbar { display: flex; align-items: center; gap: 6px; }
  .pbar img { width: 40px; height: 40px; filter: drop-shadow(0 3px 0 rgba(59, 29, 14, 0.5)); }
  .pbar .track { width: clamp(84px, 14vw, 130px); height: 14px; border: 3px solid var(--ink); border-radius: 999px;
    background: var(--cream); overflow: hidden; }
  .pbar .track i { display: block; height: 100%; transform-origin: left center; }
  .pbar-magnet i { background: linear-gradient(90deg, #ff6a55, #ff3d3d); }
  .pbar-sneakers i { background: linear-gradient(90deg, #a6f05a, #4cc23a); }
  .pbar-x2 i { background: linear-gradient(90deg, #ffe36b, #ffab1f); }
  #shield-chip { display: flex; align-items: center; gap: 4px; padding: 2px 12px 2px 2px; border: 3px solid var(--ink);
    border-radius: 999px; background: #c9f1ff; font: 900 14px/1 var(--font-cjk); }
  #shield-chip img { width: 34px; height: 34px; }
  .hud-bottom { position: absolute; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }

  #toast { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); display: flex; align-items: center;
    gap: 12px; white-space: nowrap; font: 900 clamp(26px, 5.5vw, 46px)/1 var(--font-cjk); color: var(--white);
    text-shadow: var(--ol); opacity: 0; pointer-events: none; }
  #toast img { width: clamp(52px, 9vw, 76px); height: auto; filter: drop-shadow(0 4px 0 rgba(59, 29, 14, 0.5)); }
  #toast.show { animation: toast 1.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) forwards; }
  #toast[data-tone="warn"] span { color: #ffe0d6; }

  /* ---------- screens ---------- */
  .screen { position: absolute; inset: 0; display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .dim { background: rgba(43, 22, 10, 0.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

  #loading { background: linear-gradient(#5fb6f2, #ffe3bd 80%); align-content: center; gap: 22px; }
  .load-title { font: clamp(44px, 9vw, 84px)/1 var(--font-display); color: var(--sun); text-shadow: var(--ol); }
  .load-bar { width: min(360px, 80vw); height: 22px; border: 4px solid var(--ink); border-radius: 999px; background: var(--cream);
    overflow: hidden; box-shadow: 0 5px 0 var(--ink); }
  #load-fill { display: block; height: 100%; width: 0; transition: width 0.2s;
    background: repeating-linear-gradient(-45deg, #ffb52e 0 14px, #ff8a1f 14px 28px); }
  .load-text { font: 900 16px var(--font-cjk); color: var(--ink); }

  #menu { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3vw; padding-inline: 5vw;
    background: linear-gradient(180deg, rgba(59, 29, 14, 0) 45%, rgba(59, 29, 14, 0.38)); }
  .menu-hero { justify-self: end; height: min(80vh, 760px); max-width: 100%; object-fit: contain;
    filter: drop-shadow(0 22px 18px rgba(59, 29, 14, 0.35)); animation: idle 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
  .menu-side { display: grid; gap: 22px; justify-items: start; max-width: 600px; }
  #menu-logo { width: min(600px, 42vw); filter: drop-shadow(0 10px 0 rgba(59, 29, 14, 0.25)); animation: logo-in 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  .btn { font: 900 30px/1 var(--font-cjk); color: var(--white); padding: 18px 46px 20px; border: 4px solid var(--ink);
    border-radius: 999px; background: linear-gradient(#ffdc55, #ff9e22 62%, #ff7c1a); cursor: pointer;
    box-shadow: inset 0 -7px 0 rgba(0, 0, 0, 0.12), inset 0 4px 0 rgba(255, 255, 255, 0.5), 0 7px 0 var(--ink);
    text-shadow: var(--ol); letter-spacing: 0.04em; transition: transform 0.12s; }
  .btn:hover { transform: translateY(-2px) scale(1.02); }
  .btn:active { transform: translateY(5px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12), 0 2px 0 var(--ink); }
  .btn-play { font-size: clamp(28px, 3.4vw, 38px); padding: 20px 56px 22px; animation: pulse 1.6s ease-in-out infinite; }
  .btn-alt { font-size: 22px; padding: 14px 30px 16px; background: linear-gradient(#6fe6d6, #1ea896 70%); }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--cream); border: 3px solid var(--ink);
    border-radius: 16px; box-shadow: 0 4px 0 var(--ink); font: 900 15px/1 var(--font-cjk); }
  .chip img { width: 30px; height: 30px; }
  .chip b { font: 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .keys { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--white);
    font: 900 15px/1.4 var(--font-cjk); text-shadow: var(--ol-sm); }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  kbd { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; background: var(--cream);
    color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 0 3px 0 var(--ink);
    font: 16px/1 var(--font-display); text-shadow: none; }
  .sound-hint { order: 6; opacity: 0.9; animation: pulse 1.6s ease-in-out infinite; }
  .corner { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; }

  .card { position: relative; width: min(430px, 100%); background: var(--cream); border: 4px solid var(--ink);
    border-radius: 30px; box-shadow: 0 10px 0 var(--ink), 0 30px 60px rgba(0, 0, 0, 0.25); padding: 26px 22px 26px;
    display: grid; gap: 16px; justify-items: center; text-align: center;
    animation: card-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.25); }
  .card h2 { margin: 0; font: 900 clamp(34px, 7vw, 44px)/1.1 var(--font-cjk); color: var(--white); text-shadow: var(--ol);
    text-wrap: balance; }
  .card p { margin: 0; font: 700 16px/1.5 var(--font-cjk); }
  .go-hero { width: min(210px, 50vw); margin-top: -130px; filter: drop-shadow(0 12px 10px rgba(59, 29, 14, 0.3)); }
  .go-stats { width: 100%; display: grid; gap: 8px; }
  .go-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--white); border: 3px solid var(--ink); border-radius: 14px; font: 900 16px/1 var(--font-cjk); }
  .go-row b { font: 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .go-row.main { background: #fff1c9; }
  .go-row.main b { font-size: 36px; color: var(--tangerine); text-shadow: var(--ol-sm); }
  .go-row img { width: 26px; height: 26px; vertical-align: middle; margin-right: 6px; }
  #go-ribbon { position: absolute; top: 22px; right: -16px; transform: rotate(10deg); padding: 8px 16px;
    background: var(--teal); color: var(--white); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
    font: 900 18px/1 var(--font-cjk); text-shadow: var(--ol-sm); animation: wiggle 0.9s ease-in-out infinite; }
  .card-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  @keyframes bump { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
  @keyframes flip { 0% { transform: scale(1.35) rotateY(0); } 100% { transform: scale(1) rotateY(360deg); } }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    24% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(0.96); } }
  @keyframes idle { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-14px) rotate(1.5deg); } }
  @keyframes logo-in { 0% { transform: scale(0.4) rotate(-6deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes card-in { 0% { transform: translateY(40px) scale(0.85); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes wiggle { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(4deg) scale(1.06); } }

  @media (max-width: 820px), (max-aspect-ratio: 1/1) {
    #menu { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding-inline: 16px; }
    .menu-side { display: contents; }
    #menu-logo { order: 1; width: min(92vw, 520px); }
    .menu-hero { order: 2; height: min(40vh, 420px); justify-self: center; }
    .btn-play { order: 3; }
    .chips { order: 4; justify-content: center; }
    .keys { order: 5; justify-content: center; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .menu-hero, .btn-play, #go-ribbon { animation: none; }
  }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>

<div id="app">
  <canvas id="scene" aria-label="Tabby Rush 遊戲畫面"></canvas>
  <div id="touch"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span id="score">0</span>
        <span id="mult">×1</span>
      </div>
      <div class="hud-right">
        <div class="coin-row">
          <div id="coin-box"><img src="assets/ui/icon_coin.webp" alt="金幣"><span id="coins">0</span></div>
          <button id="btn-pause" class="icon-btn" aria-label="暫停">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#3b1d0e"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#3b1d0e"/></svg>
          </button>
        </div>
        <div id="powerbars"></div>
        <div id="shield-chip" hidden><img src="assets/ui/icon_shield.webp" alt="">護盾</div>
      </div>
    </div>
    <div class="hud-bottom">
      <button id="btn-sound-hud" class="icon-btn" aria-label="關閉聲音">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d0e"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#3b1d0e" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d0e"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#3b1d0e" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <section id="loading" class="screen">
    <div class="load-title">TABBY RUSH</div>
    <div class="load-bar"><i id="load-fill"></i></div>
    <div class="load-text" id="load-text">正在把軌道鋪好… 0%</div>
  </section>

  <section id="menu" class="screen" hidden>
    <img class="menu-hero" src="assets/hero/portrait.webp" alt="穿虎斑貓裝的主角">
    <div class="menu-side">
      <img id="menu-logo" src="assets/ui/logo.webp" alt="Tabby Rush">
      <button id="btn-play" class="btn btn-play">開始衝刺</button>
      <div class="chips">
        <div class="chip">最高分 <b id="best">0</b></div>
        <div class="chip"><img src="assets/ui/icon_coin.webp" alt="金幣"><b id="bank">0</b></div>
      </div>
      <p class="keys" id="hint-keys">
        <span><kbd>←</kbd><kbd>→</kbd> 換道</span>
        <span><kbd>↑</kbd> 跳躍</span>
        <span><kbd>↓</kbd> 翻滾</span>
        <span><kbd>P</kbd> 暫停</span>
      </p>
      <p class="keys" id="hint-touch" hidden>滑動螢幕：左右換道・往上跳・往下翻滾</p>
      <p class="keys sound-hint" id="hint-sound">點一下畫面開啟音樂</p>
    </div>
    <button id="btn-sound" class="icon-btn corner" aria-label="關閉聲音">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d0e"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#3b1d0e" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d0e"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#3b1d0e" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="card">
      <h2>喘口氣</h2>
      <p>列車會等你回來。</p>
      <div class="card-actions">
        <button id="btn-resume" class="btn">繼續</button>
        <button id="btn-quit" class="btn btn-alt">回主選單</button>
      </div>
    </div>
  </section>

  <section id="over" class="screen dim" hidden>
    <div class="card">
      <img class="go-hero" src="assets/hero/crash.webp" alt="">
      <div id="go-ribbon" hidden>新紀錄！</div>
      <h2>撞車啦！</h2>
      <div class="go-stats">
        <div class="go-row main"><span>分數</span><b id="go-score">0</b></div>
        <div class="go-row"><span><img src="assets/ui/icon_coin.webp" alt="">金幣</span><b id="go-coins">0</b></div>
        <div class="go-row"><span>距離</span><b id="go-dist">0 m</b></div>
        <div class="go-row"><span>最高分</span><b id="go-best">0</b></div>
      </div>
      <div class="card-actions">
        <button id="btn-retry" class="btn">再跑一次</button>
        <button id="btn-home" class="btn btn-alt">主選單</button>
      </div>
    </div>
  </section>
</div>

<script type="module" src="src/main.js"></script>

</html>
